name: install-check
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: one-line install
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
      - name: use it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          aibase version
          aibase refresh >/dev/null
          aibase context
          aibase doctor
  windows:
    runs-on: windows-latest
    steps:
      - name: one-line install
        shell: pwsh
        run: irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
      - name: use it
        shell: pwsh
        run: |
          $env:Path = "$env:LOCALAPPDATA\Programs\aibase;$env:Path"
          aibase version
          aibase refresh | Out-Null
          aibase context
          aibase doctor
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
  clone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: git clone && ./install.sh (with Go)
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }} aibase
          cd aibase && ./install.sh
          "$HOME/.local/bin/aibase" version
          "$HOME/.local/bin/aibase" context
  clone-no-go:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: git clone && ./install.sh (no Go)
        run: |
          apt-get update -qq && apt-get install -y -qq git curl ca-certificates >/dev/null
          ! command -v go
          git clone --depth 1 https://github.com/${{ github.repository }} aibase
          cd aibase && ./install.sh
          aibase version
          aibase context
  clone-windows:
    runs-on: windows-latest
    steps:
      - name: git clone; .\install.ps1
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }} aibase
          cd aibase
          ./install.ps1
          & "$env:LOCALAPPDATA\Programs\aibase\aibase.exe" version
          & "$env:LOCALAPPDATA\Programs\aibase\aibase.exe" context
  codex-trust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Codex, then aibase (setup must trust its Codex hooks)
        shell: bash
        run: |
          npm install -g @openai/codex
          codex --version
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -c 'irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex'
            export PATH="$(cygpath "$LOCALAPPDATA")/Programs/aibase:$PATH"
          else
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          fi
          aibase doctor | tee doctor.txt || true
          grep -q "client.codex: hooks trusted and enabled in Codex" doctor.txt
